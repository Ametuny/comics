<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Comic Reader</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="reader">

  <div class="top-bar">
    <h1 class="title">Basya Comics</h1>
    <span id="counter"></span>
  </div>

  <div class="page-container">
    <img id="page-current" class="page">
    <img id="page-next" class="page hidden">
  </div>

  <div class="controls">
  <button id="prev" class="nav-btn">
    <span class="arrow left"></span>
  </button>
  <button id="next" class="nav-btn">
    <span class="arrow right"></span>
  </button>
</div>



</div>

<script src="script.js"></script>
</body>
</html>
